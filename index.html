<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipzilla Live</title><style>
:root{--bg:#0b0d14;--card:#141826;--line:#252b40;--tx:#e9ecf5;--mut:#8b93ad;--g:#3ddc97;--p:#a78bfa}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:18px 14px 60px;max-width:560px;margin:auto}
h1{font-size:22px;font-weight:600}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}.dot{width:9px;height:9px;border-radius:50%;background:#555}.on .dot{background:var(--g);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}100%{box-shadow:0 0 0 10px rgba(61,220,151,0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px;font-weight:600}.stat span{font-size:12px;color:var(--mut)}
.flow{position:relative;padding-left:34px}.rail{position:absolute;left:13px;top:10px;bottom:10px;width:2px;background:var(--line)}
.node{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;transition:.3s}
.node::before{content:"";position:absolute;left:-27px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.node h3{font-size:15px;font-weight:600}.node p{font-size:12.5px;color:var(--mut)}.node .st{position:absolute;right:12px;top:12px;font-size:11px;color:var(--mut)}
.node.run{border-color:var(--g);box-shadow:0 0 0 1px var(--g),0 0 22px rgba(61,220,151,.25)}.node.run::before{border-color:var(--g);background:var(--g)}.node.run .st{color:var(--g)}
.node.done::before{border-color:var(--g);background:#0f3a2a}.node.done .st{color:var(--g)}.node.man{border-style:dashed}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .8s}
.log{background:#080a10;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px;font:12px/1.6 ui-monospace,monospace;height:170px;overflow:auto;color:#9fe8c4}.log span{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:12px}</style></head><body>
<div class="top"><h1>Clipzilla Live</h1><div class="live" id="live"><i class="dot"></i><span id="mode">lade ...</span></div></div>
<div class="stats"><div class="stat"><b id="sRun">-</b><span>Lauf</span></div><div class="stat"><b id="sClips">-</b><span>Clips heute</span></div><div class="stat"><b id="sAge">-</b><span>Letztes Update</span></div></div>
<div class="flow" id="flow"><div class="rail"></div></div><div class="log" id="log"></div>
<p class="note">Die Seite fragt alle 4 Sekunden den Bot-Status ab.</p>
<script>
var STEPS=[["Auslöser","Manuell oder Zeitplan",0],["Quelle wählen","sources.json, Dedupe",0],["Download","yt-dlp, ein Abschnitt",0],["Transkript","faster-whisper",0],["Momente wählen","Claude: Hook + Caption",0],["Schneiden","ffmpeg 9:16, Untertitel",0],["GitHub Release","Clips + captions.json",0],["Deine Freigabe","Clips und Captions prüfen",1],["Posten","TikTok, Instagram, YouTube",1],["Link bei Rewards","Eintragen, binnen 30 Min",1]];
var flow=document.getElementById("flow"),nodes=[];
STEPS.forEach(function(s){var d=document.createElement("div");d.className="node"+(s[2]?" man":"");d.innerHTML="<h3>"+s[0]+"</h3><p>"+s[1]+"</p><span class='st'>wartet</span><div class='bar'><i></i></div>";flow.appendChild(d);nodes.push(d)});
function ago(t){var s=Math.max(0,Math.round((Date.now()-new Date(t))/1000));return s<90?s+" s":Math.round(s/60)+" min"}
function draw(d){var run=d.state==="running";document.getElementById("live").className="live"+(run?" on":"");
document.getElementById("mode").textContent=run?"Bot arbeitet":"Bot wartet";
document.getElementById("sRun").textContent="#"+d.run;document.getElementById("sClips").textContent=d.clips_today;document.getElementById("sAge").textContent=ago(d.updated);
nodes.forEach(function(n,i){var c="node"+(STEPS[i][2]?" man":""),st="wartet",w=0;
if(i<d.step||(d.state==="idle"&&i<=d.step&&d.step>=7)){c+=" done";st="fertig";w=100}
else if(i===d.step&&run){c+=" run";st="läuft";w=d.progress||50}
n.className=c;n.querySelector(".st").textContent=st;n.querySelector(".bar i").style.width=w+"%"});
var l=document.getElementById("log");l.innerHTML=(d.log||[]).map(function(x){return "<div><span>"+x.t+"</span> "+x.m+"</div>"}).join("");l.scrollTop=l.scrollHeight}
function poll(){fetch("status.json?"+Date.now()).then(function(r){return r.json()}).then(draw).catch(function(){document.getElementById("mode").textContent="keine Verbindung"})}
poll();setInterval(poll,4000);
</script></body></html>
